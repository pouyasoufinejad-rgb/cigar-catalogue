name: Apply runtime cache bust

on:
  push:
    branches: [fix/force-editor-hotfix-deploy]
    paths:
      - '.github/workflows/apply-runtime-cache-bust.yml'
      - 'scripts/apply-runtime-cache-bust.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/force-editor-hotfix-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Worker runtime cache bust and verify
        run: |
          node scripts/apply-runtime-cache-bust.mjs
          npm test
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-runtime-cache-bust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Version editor runtime deployment'
          git push origin HEAD:fix/force-editor-hotfix-deploy
