name: Apply editor focus hotfix

on:
  push:
    branches: [fix/recommendation-editor-focus-loop-red]
    paths:
      - '.github/workflows/editor-focus-hotfix.yml'
      - 'scripts/apply-editor-focus-hotfix.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recommendation-editor-focus-loop-red
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal patch and verify
        run: |
          node scripts/apply-editor-focus-hotfix.mjs
          npm test
      - name: Remove temporary patch tooling and commit
        run: |
          rm -f scripts/apply-editor-focus-hotfix.mjs .github/workflows/editor-focus-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix recommendation editor focus loop'
          git push origin HEAD:fix/recommendation-editor-focus-loop-red
