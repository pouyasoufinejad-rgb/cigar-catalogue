name: Publish catalogue request

on:
  pull_request:
    paths:
      - '.github/workflows/publish-catalogue.yml'
      - 'catalogue-requests/**'
      - 'public/**'
      - 'scripts/publish-catalogue-request.mjs'
      - 'scripts/publish-live-catalogue-request.mjs'
      - 'scripts/cleanup-live-card-copy.mjs'
      - 'scripts/cleanup-live-markup-notes.mjs'
      - 'scripts/normalise-live-card-structure.mjs'
      - 'scripts/repair-pre-sidebar-live-state.mjs'
      - 'test/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-catalogue.yml'
      - 'catalogue-requests/**'
      - 'public/**'
      - 'scripts/publish-catalogue-request.mjs'
      - 'scripts/publish-live-catalogue-request.mjs'
      - 'scripts/cleanup-live-card-copy.mjs'
      - 'scripts/cleanup-live-markup-notes.mjs'
      - 'scripts/normalise-live-card-structure.mjs'
      - 'scripts/repair-pre-sidebar-live-state.mjs'
      - 'test/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Repository-relative catalogue request JSON to retry'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-production-publisher
  cancel-in-progress: false

jobs:
  verify:
    name: Test publisher and Worker rendering
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  publish:
    name: Publish changed catalogue requests
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
      REQUEST_PATH: ${{ inputs.request_path }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish requests sequentially
        shell: bash
        run: |
          set -euo pipefail

          files=()
          cleanup_changed=false
          note_cleanup_changed=false
          structure_changed=false
          repair_changed=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${REQUEST_PATH}" =~ ^catalogue-requests/[A-Za-z0-9._-]+\.json$ ]]; then
              echo "::error::request_path must be a JSON file directly under catalogue-requests/."
              exit 1
            fi
            if [[ ! -f "${REQUEST_PATH}" ]]; then
              echo "::error::Request file does not exist: ${REQUEST_PATH}"
              exit 1
            fi
            files=("${REQUEST_PATH}")
          else
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'catalogue-requests/*.json')
              if git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'scripts/cleanup-live-card-copy.mjs' | grep -q .; then
                cleanup_changed=true
              fi
              if git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'scripts/cleanup-live-markup-notes.mjs' | grep -q .; then
                note_cleanup_changed=true
              fi
              if git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'scripts/normalise-live-card-structure.mjs' | grep -q .; then
                structure_changed=true
              fi
              if git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'scripts/repair-pre-sidebar-live-state.mjs' | grep -q .; then
                repair_changed=true
              fi
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r --diff-filter=AM "${GITHUB_SHA}" -- 'catalogue-requests/*.json')
              if git diff-tree --no-commit-id --name-only -r --diff-filter=AM "${GITHUB_SHA}" -- 'scripts/cleanup-live-card-copy.mjs' | grep -q .; then
                cleanup_changed=true
              fi
              if git diff-tree --no-commit-id --name-only -r --diff-filter=AM "${GITHUB_SHA}" -- 'scripts/normalise-live-card-structure.mjs' | grep -q .; then
                structure_changed=true
              fi
              if git diff-tree --no-commit-id --name-only -r --diff-filter=AM "${GITHUB_SHA}" -- 'scripts/repair-pre-sidebar-live-state.mjs' | grep -q .; then
                repair_changed=true
              fi
            fi
          fi

          if (( ${#files[@]} == 0 )) && [[ "${cleanup_changed}" != "true" ]] && [[ "${note_cleanup_changed}" != "true" ]] && [[ "${structure_changed}" != "true" ]] && [[ "${repair_changed}" != "true" ]]; then
            echo "No catalogue request JSON files or live repair/normaliser changed; nothing to publish."
            exit 0
          fi

          if [[ -z "${CATALOGUE_ADMIN_TOKEN:-}" ]]; then
            echo "::error::CATALOGUE_ADMIN_TOKEN repository Actions secret is not configured."
            exit 1
          fi

          for request in "${files[@]}"; do
            if [[ ! "${request}" =~ ^catalogue-requests/[A-Za-z0-9._-]+\.json$ ]]; then
              echo "::error::Refusing unexpected request path: ${request}"
              exit 1
            fi
            echo "Publishing ${request} from current live Worker state"
            node scripts/publish-live-catalogue-request.mjs "${request}"
          done

          if [[ "${cleanup_changed}" == "true" ]]; then
            echo "Cleaning redundant untasted/projected wording from current live card copy"
            node scripts/cleanup-live-card-copy.mjs
          fi

          if [[ "${note_cleanup_changed}" == "true" ]] || (( ${#files[@]} > 0 )); then
            echo "Replacing redundant markup notes with cigar-specific editorial notes"
            node scripts/cleanup-live-markup-notes.mjs
          fi

          if [[ "${repair_changed}" == "true" ]]; then
            echo "Reconstructing pre-sidebar Production, Practical and retailer-link state"
            node scripts/repair-pre-sidebar-live-state.mjs
          fi

          # The repair writes Production/Practical structure, but the normaliser is the
          # authority on it. If the repair runs without the normaliser following it, the
          # catalogue is left holding un-canonicalised structure.
          if [[ "${structure_changed}" == "true" ]] || [[ "${repair_changed}" == "true" ]] || (( ${#files[@]} > 0 )); then
            echo "Normalising Production and Practical structures across current live catalogue"
            node scripts/normalise-live-card-structure.mjs
          fi

      - name: Upload pre-repair live-state backup
        if: ${{ always() && hashFiles('pre-repair-live-state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-sidebar-repair-live-state-${{ github.run_id }}
          path: pre-repair-live-state.json
          retention-days: 30
