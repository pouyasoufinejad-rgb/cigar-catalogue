name: Publish catalogue request

on:
  pull_request:
    paths:
      - '.github/workflows/publish-catalogue.yml'
      - 'catalogue-requests/**'
      - 'public/**'
      - 'scripts/publish-catalogue-request.mjs'
      - 'scripts/publish-live-catalogue-request.mjs'
      - 'scripts/cleanup-live-card-copy.mjs'
      - 'scripts/normalise-live-card-structure.mjs'
      - 'test/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-catalogue.yml'
      - 'catalogue-requests/**'
      - 'public/**'
      - 'scripts/publish-catalogue-request.mjs'
      - 'scripts/publish-live-catalogue-request.mjs'
      - 'scripts/cleanup-live-card-copy.mjs'
      - 'scripts/normalise-live-card-structure.mjs'
      - 'test/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Repository-relative catalogue request JSON to retry'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-production-publisher
  cancel-in-progress: false

jobs:
  verify:
    name: Test publisher and Worker rendering
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  publish:
    name: Publish requested catalogue file
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
      REQUEST_PATH: ${{ inputs.request_path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${REQUEST_PATH}" =~ ^catalogue-requests/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "::error::request_path must be a JSON file directly under catalogue-requests/."
            exit 1
          fi
          if [[ ! -f "${REQUEST_PATH}" ]]; then
            echo "::error::Request file does not exist: ${REQUEST_PATH}"
            exit 1
          fi
          if [[ -z "${CATALOGUE_ADMIN_TOKEN:-}" ]]; then
            echo "::error::CATALOGUE_ADMIN_TOKEN repository Actions secret is not configured."
            exit 1
          fi
          node scripts/publish-live-catalogue-request.mjs "${REQUEST_PATH}"
