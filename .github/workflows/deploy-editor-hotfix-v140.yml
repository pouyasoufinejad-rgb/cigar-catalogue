name: Deploy editor hotfix v140

on:
  push:
    branches:
      - deploy/editor-hotfix-v140

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      WORKERS_API_TOKEN: ${{ secrets.WORKERS_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_EMAIL: ${{ secrets.CF_EMAIL }}
    steps:
      - name: Check out fixed catalogue
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Detect configured Cloudflare credential name
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CLOUDFLARE_WORKERS_API_TOKEN WORKERS_API_TOKEN CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL CF_API_KEY CF_EMAIL CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!name:-}" ]; then
              echo "configured:$name"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No known Cloudflare credential secret is configured."
            exit 1
          fi

      - name: Normalize alternate token names
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-${CLOUDFLARE_TOKEN:-${CLOUDFLARE_WORKERS_API_TOKEN:-${WORKERS_API_TOKEN:-}}}}}"
          if [ -n "$token" ]; then
            echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          fi
          if [ -z "${CLOUDFLARE_API_KEY:-}" ] && [ -n "${CF_API_KEY:-}" ]; then
            echo "CLOUDFLARE_API_KEY=$CF_API_KEY" >> "$GITHUB_ENV"
          fi
          if [ -z "${CLOUDFLARE_EMAIL:-}" ] && [ -n "${CF_EMAIL:-}" ]; then
            echo "CLOUDFLARE_EMAIL=$CF_EMAIL" >> "$GITHUB_ENV"
          fi

      - name: Run full test suite
        run: npm test

      - name: Deploy Worker with Wrangler
        run: npx wrangler deploy

      - name: Verify live editor hotfix
        shell: bash
        run: |
          set -euo pipefail
          base="https://cigar-catalogue.psncodex.workers.dev"
          for attempt in $(seq 1 18); do
            headers="$(curl -fsSI "$base/?deploy_verify=$attempt" || true)"
            html="$(curl -fsS "$base/?deploy_verify=$attempt" || true)"
            runtime="$(curl -fsS "$base/catalogue-runtime.mjs?v=140&deploy_verify=$attempt" || true)"
            hotfix="$(curl -fsS "$base/catalogue-recommendation-subsections.mjs?v=editor-focus-1&deploy_verify=$attempt" || true)"
            if printf '%s' "$headers" | tr -d '\r' | grep -qi '^x-cigar-catalogue-version: 140$' \
              && printf '%s' "$html" | grep -q 'catalogue-runtime.mjs?v=140' \
              && printf '%s' "$runtime" | grep -q 'catalogue-recommendation-subsections.mjs?v=editor-focus-1' \
              && printf '%s' "$hotfix" | grep -Eq 'observer\.observe\((catalogueRoot|observationRoot)' \
              && printf '%s' "$hotfix" | grep -Eq 'card\.parentElement !== grid|grid\.insertBefore\(card, expected\)'; then
              echo "Live Worker v140 and editor hotfix verified."
              exit 0
            fi
            sleep 5
          done
          echo "Deployment completed but live v140 verification did not converge."
          exit 1
