name: Discover exact Cigarworld package links

on:
  push:
    branches: [audit/cigarworld-price-integrity]
    paths:
      - '.github/workflows/cigarworld-price-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Find exact pack links in Cigarworld HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 35 -A 'Cigar Catalogue Stock Checker/1.0' 'https://www.cigarworld.com.au/aud/categories/cigars/arturo-fuente-%28dominican%29/arturo-fuente-cigars-%28dominican-republic%29/' -o /tmp/fuente.html
          curl -LfsS --max-time 35 -A 'Cigar Catalogue Stock Checker/1.0' 'https://www.cigarworld.com.au/aud/categories/cigars/drew-estate-%28nicaragua%29/liga-privada/' -o /tmp/liga.html
          python3 - <<'PY'
          import re,html,urllib.parse
          cases=[('/tmp/fuente.html',['CUBANITOS','PACK OF 10']),('/tmp/liga.html',['T52','CORONET'])]
          for file,tokens in cases:
              raw=open(file,encoding='utf8',errors='replace').read()
              print('\nFILE',file)
              for m in re.finditer(r'<a\b([^>]*)>([\s\S]*?)</a>',raw,re.I):
                  attrs=m.group(1); body=m.group(2)
                  text=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',body))).strip()
                  if not all(t.lower() in text.lower() for t in tokens[:1]): continue
                  hrefm=re.search(r'href\s*=\s*["\']([^"\']+)',attrs,re.I)
                  if hrefm: print('ANCHOR',repr(text[:220]),html.unescape(hrefm.group(1)))
              for token in ['CUBANITOS - PACK OF 10','T52 CORONET']:
                  idx=raw.lower().find(token.lower())
                  if idx>=0:
                      snippet=raw[max(0,idx-2200):idx+4200]
                      text=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' | ',snippet))).strip()
                      print('SNIPPET',token,text[:5000])
          PY
