name: Restore reverted catalogue fields

# Re-applies catalogue request values that the sidebar partial-write regression
# reverted to the static seed baseline. Defaults to a read-only dry run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports only; apply writes to live KV'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-production-publisher
  cancel-in-progress: false

jobs:
  restore:
    name: ${{ inputs.mode }} reverted catalogue fields
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Restore reverted fields
        run: |
          if [[ "${{ inputs.mode }}" == "apply" ]]; then
            node scripts/restore-reverted-card-fields.mjs --apply
          else
            node scripts/restore-reverted-card-fields.mjs
          fi
        shell: bash
