name: Apply catalogue build trigger 140

on:
  push:
    branches: [fix/trigger-worker-build-140]
    paths:
      - '.github/workflows/apply-build-trigger-140.yml'
      - 'scripts/apply-build-trigger-140.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trigger-worker-build-140
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply static entrypoint marker and verify
        run: |
          node scripts/apply-build-trigger-140.mjs
          npm test
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/apply-build-trigger-140.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mark catalogue runtime build v140'
          git push origin HEAD:fix/trigger-worker-build-140
