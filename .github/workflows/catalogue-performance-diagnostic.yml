name: Catalogue performance diagnostic

on:
  push:
    paths:
      - '.github/workflows/catalogue-performance-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Worker
        shell: bash
        run: |
          set -euo pipefail
          base='https://cigar-catalogue.psncodex.workers.dev'
          echo '=== live module deployment ==='
          deployed=0
          for attempt in $(seq 1 18); do
            curl -fsS "$base/catalogue-admin-unified-v139.mjs?deploy_probe=$attempt" -o /tmp/admin.mjs
            if grep -Fq 'loadStateForBrowser({ applyStructural: false })' /tmp/admin.mjs; then
              echo "optimized_module_live=1 attempt=$attempt"
              deployed=1
              break
            fi
            echo "optimized_module_live=0 attempt=$attempt"
            sleep 5
          done
          if [[ "$deployed" != 1 ]]; then
            echo '::error::Live Worker is not serving the optimized admin module.'
            exit 1
          fi

          echo '=== catalogue state ==='
          curl -fsS "$base/api/catalogue-overrides" -o /tmp/state.json
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const cards = state.cards || {};
          const entries = state.entries || {};
          const structural = new Set(['brand','title','packagePrice','packageLabel','price','country','length','ring','risk','taster','retailerLinks','imageUrl','smokeTime']);
          const structuralCount = Object.values(cards).filter(card => card && Object.keys(card).some(k => structural.has(k))).length;
          const rankingOnly = Object.values(cards).filter(card => card && Object.keys(card).length && !Object.keys(card).some(k => structural.has(k))).length;
          console.log(JSON.stringify({bytes:fs.statSync('/tmp/state.json').size,cards:Object.keys(cards).length,entries:Object.keys(entries).length,structuralCount,rankingOrEditorialOnly:rankingOnly,updatedAt:state.updatedAt}, null, 2));
          NODE
          echo '=== live root probes (compressed) ==='
          for i in 1 2 3 4 5; do
            curl -fsS --compressed -o /tmp/page.html -D /tmp/headers.txt \
              -w "run=$i code=%{http_code} ttfb=%{time_starttransfer} total=%{time_total} downloaded=%{size_download} speed=%{speed_download}\n" \
              "$base/?perf_probe=$i"
          done
          echo "decoded_bytes=$(wc -c < /tmp/page.html)"
          echo '=== response headers ==='
          grep -Ei '^(cache-control|content-encoding|content-length|etag|cf-cache-status|server-timing|x-cigar-catalogue-version):' /tmp/headers.txt || true
