name: Apply isolated v4 publisher fix

on:
  push:
    branches: [fix/v4-sparse-ranking-readback]
    paths:
      - '.github/workflows/patch-v4-publisher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-sparse-ranking-readback
      - name: Patch sparse v4 read-back verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/publish-catalogue-request.mjs')
          text = path.read_text()
          old = """async function verifyV4State(fetchImpl, baseUrl, repoRoot, includeStaticCatalogue, state, label) {\n  assertRankingInvariant(state.cards, label, state.version);\n  const effective = await completeRankingCards(repoRoot, state, includeStaticCatalogue);\n  assertV4Inventory(state, effective, label);\n  return effective;\n}"""
          new = """async function verifyV4State(fetchImpl, baseUrl, repoRoot, includeStaticCatalogue, state, label) {\n  const effective = await completeRankingCards(repoRoot, state, includeStaticCatalogue);\n  assertRankingInvariant(effective, label, state.version);\n  assertV4Inventory(state, effective, label);\n  return effective;\n}"""
          if text.count(old) != 1:
              raise SystemExit('Expected verifyV4State implementation was not found exactly once.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- scripts/publish-catalogue-request.mjs
      - name: Commit isolated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-catalogue-request.mjs
          git commit -m "Fix v4 sparse ranking read-back verification"
          git push origin HEAD:fix/v4-sparse-ranking-readback
