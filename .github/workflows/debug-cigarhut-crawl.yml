name: Debug catalogue target keys

on:
  push:
    branches:
      - debug/cigarhut-crawl

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find retailer-link target keys
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { extractStockTargetsFromHtml } from './src/stock.js';
          const base='https://cigar-catalogue.psncodex.workers.dev';
          const nonce=Date.now();
          const [html,state]=await Promise.all([
            fetch(`${base}/?audit=${nonce}`).then(r=>r.text()),
            fetch(`${base}/api/catalogue-overrides?audit=${nonce}`).then(r=>r.json())
          ]);
          const targets=extractStockTargetsFromHtml(html,state);
          for(const t of targets){
            const hay=(t.key+' '+t.title+' '+t.retailerLinks.join(' ')).toLowerCase();
            if(/cubanito|t52|churchill.*petite|petite.*churchill/.test(hay)) console.log(JSON.stringify(t));
          }
          NODE
