name: Debug CigarHut crawl

on:
  push:
    branches:
      - debug/cigarhut-crawl

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect unresolved CigarHut products
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { detectAvailability, extractRetailerPrice } from './src/stock.js';
          const cases=[
            ['axe','https://www.cigarhut.com.au/alonso-menendez-axe-charutos-pack-of-5/','Alonso Menendez Axe Charutos',48],
            ['nero','https://www.cigarhut.com.au/toscano-toscanello-nero-cioccolato/','Toscanello Nero Cioccolato',0]
          ];
          for(const [name,url,title,packagePrice] of cases){
            const r=await fetch(url,{headers:{'user-agent':'Cigar Catalogue Stock Checker/1.0'},redirect:'follow',cache:'no-store'});
            const h=await r.text();
            console.log('DIRECT',name,r.status,r.url,'len',h.length,'avail',detectAvailability(h),'price',extractRetailerPrice(h,{title,packagePrice,packageLabel:''}),'title',h.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g,' ').trim());
            for(const q of [title,name==='axe'?'axe charutos':'toscanello nero',name==='axe'?'alonso menendez':'nero cioccolato']){
              const s=new URL('https://www.cigarhut.com.au/search.php');s.searchParams.set('search_query',q);
              const sr=await fetch(s,{headers:{'user-agent':'Cigar Catalogue Stock Checker/1.0'},redirect:'follow',cache:'no-store'});const sh=await sr.text();
              const links=[...sh.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].map(m=>({href:m[1],text:m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()})).filter(x=>/axe|charutos|toscanello|nero|cioccolato/i.test(x.href+' '+x.text)).slice(0,30);
              console.log('SEARCH',name,JSON.stringify(q),sr.status,'matches',JSON.stringify(links));
            }
          }
          NODE
