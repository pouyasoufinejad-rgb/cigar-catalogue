name: One-shot catalogue v7 cache bust

on:
  push:
    branches:
      - fix/catalogue-subsection-editor-regressions
    paths:
      - '.github/workflows/bump-catalogue-v7.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalogue-subsection-editor-regressions
      - name: Bump current catalogue runtime generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = [Path('.github'), Path('public'), Path('scripts'), Path('src'), Path('test')]
          replacements = (
              ('20260914-v6', '20260914-v7'),
              ('v6 runtime', 'v7 runtime'),
              ('Live v6 runtime', 'Live v7 runtime'),
              ('the v6 runtime', 'the v7 runtime'),
              ('a stale v5 bootstrap and runtime chain', 'a stale v6 bootstrap and runtime chain'),
          )
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.mjs', '.js', '.yml', '.yaml'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  next_text = text
                  for old, new in replacements:
                      next_text = next_text.replace(old, new)
                  if next_text != text:
                      path.write_text(next_text, encoding='utf-8')
                      changed.append(str(path))
          print('\n'.join(changed))
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github public scripts src test
          git commit -m 'fix: cache-bust catalogue regression fix to v7'
          git push origin HEAD:fix/catalogue-subsection-editor-regressions
