name: Apply Recommendation runtime cache-bust

on:
  push:
    branches: [fix/recommendation-runtime-cache-bust]
    paths:
      - '.github/workflows/patch-runtime-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recommendation-runtime-cache-bust
      - name: Version top-level catalogue runtime URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text()
          old = 'src="/catalogue-runtime.mjs"'
          new = 'src="/catalogue-runtime.mjs?v=20260914-v4"'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Expected catalogue runtime script reference not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          grep -oE '<script[^>]+catalogue-runtime[^>]*>' public/index.html
      - name: Commit cache-bust
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fix stale Recommendation runtime cache"
          git push origin HEAD:fix/recommendation-runtime-cache-bust
