name: Patch v5 runtime bootstrap

on:
  push:
    branches: [fix/recommendation-page-composition]
    paths:
      - '.github/workflows/patch-v5-runtime-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recommendation-page-composition
      - name: Patch runtime bootstrap version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index-core.js')
          text = path.read_text()
          old = 'catalogue-runtime.mjs?v=20260914-v4'
          new = 'catalogue-runtime.mjs?v=20260914-v5'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one v4 runtime bootstrap, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/index-core.js
      - name: Commit bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index-core.js
          git commit -m "fix: bump catalogue runtime bootstrap to v5"
          git push origin HEAD:fix/recommendation-page-composition
