name: Diagnose live edit flow v140

on:
  push:
    branches:
      - diag/live-edit-click-browser-v140

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Map visible edit targets
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:1440, height:1200 } });
            const consoleErrors=[]; const pageErrors=[];
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e)));
            await page.goto('https://cigar-catalogue.psncodex.workers.dev/?diag_edit_targets=1', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(1000);
            await page.locator('#catalogue-admin-toggle').click();
            await page.waitForTimeout(200);
            const card = page.locator('article.card[data-key]:visible').first();
            await card.click({ position:{ x:30, y:30 } });
            await page.waitForTimeout(300);
            const map = await page.evaluate(() => {
              const selected = document.querySelector('article.card.catalogue-direct-selected');
              const selectors = ['h3','.brand','.price','.summary','.mog-note','.eyebrow','.artmeta-left','.artmeta-right','.tag-items','.verdict','.why','.card-title','.card-copy','.card-description','.experience','.production','.practical'];
              const one = sel => {
                const n = selected?.querySelector(sel); if (!n) return null;
                const r=n.getBoundingClientRect(), s=getComputedStyle(n);
                return { sel, tag:n.tagName, cls:n.className, text:(n.textContent||'').trim().slice(0,180), contentEditable:n.contentEditable, rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)], display:s.display, visibility:s.visibility, opacity:s.opacity, pointerEvents:s.pointerEvents, visible:!!(r.width&&r.height&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0') };
              };
              const targets = selectors.map(one).filter(Boolean);
              const visibleText = Array.from(selected?.querySelectorAll('*')||[]).map(n => {
                const r=n.getBoundingClientRect(), s=getComputedStyle(n), text=(n.textContent||'').trim();
                if (!text || !r.width || !r.height || s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return null;
                if (n.children.length && Array.from(n.children).some(c => (c.textContent||'').trim()===text)) return null;
                return { tag:n.tagName, cls:n.className, text:text.slice(0,140), rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)], ce:n.contentEditable, pe:s.pointerEvents };
              }).filter(Boolean).slice(0,80);
              return { key:selected?.dataset.key, targets, visibleText, htmlClass:selected?.className };
            });
            console.log('VISIBLE_MAP', JSON.stringify(map));
            console.log('PAGE_ERRORS', JSON.stringify(pageErrors));
            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors));
            await page.screenshot({path:'live-edit-visible-map.png', fullPage:true});
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-edit-visible-map
          path: live-edit-visible-map.png
          if-no-files-found: ignore
