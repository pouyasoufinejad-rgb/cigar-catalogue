name: Verify compact-card editor production

on:
  push:
    branches:
      - diag/live-edit-click-browser-v140

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify editable compact card in production
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:1440, height:1200 } });
            const pageErrors=[];
            page.on('pageerror', e => pageErrors.push(String(e)));
            const base='https://cigar-catalogue.psncodex.workers.dev/';
            await page.goto(base+'?verify_compact_edit_production=1', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(1200);

            const runtime = await page.evaluate(() => Array.from(document.scripts).map(s => s.src).find(src => src.includes('catalogue-runtime.mjs')) || '');
            assert.match(runtime, /catalogue-runtime\.mjs\?v=140/);
            const runtimeBody = await (await page.request.get(base+'catalogue-runtime.mjs?v=140&verify=1')).text();
            assert.match(runtimeBody, /catalogue-direct-edit\.mjs\?v=compact-edit-1/);
            assert.match(runtimeBody, /catalogue-convenience\.mjs\?v=direct-edit-1/);

            const card = page.locator('article.card[data-key]:visible').first();
            const key = await card.getAttribute('data-key');
            assert.ok(key, 'expected first visible card key');
            assert.equal(await card.evaluate(el => el.classList.contains('convenience-compact')), true, 'card should start compact');

            await page.locator('#catalogue-admin-toggle').click();
            await page.waitForTimeout(150);
            await card.click({ position:{ x:30, y:30 } });
            await page.waitForTimeout(350);

            const selectedState = await card.evaluate(el => {
              const summary=el.querySelector('.summary');
              const rect=summary?.getBoundingClientRect();
              const style=summary ? getComputedStyle(summary) : null;
              return {
                selected: el.classList.contains('catalogue-direct-selected'),
                compact: el.classList.contains('convenience-compact'),
                expanded: el.classList.contains('convenience-expanded'),
                marker: el.dataset.catalogueDirectWasCompact || '',
                summaryEditable: summary?.contentEditable || '',
                summaryDisplay: style?.display || '',
                summaryVisible: !!(rect && rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden')
              };
            });
            console.log('SELECTED_STATE', JSON.stringify(selectedState));
            assert.equal(selectedState.selected, true);
            assert.equal(selectedState.compact, false);
            assert.equal(selectedState.expanded, true);
            assert.equal(selectedState.marker, '1');
            assert.equal(selectedState.summaryEditable, 'true');
            assert.equal(selectedState.summaryVisible, true);

            const summary=card.locator('.summary');
            const before=await summary.textContent();
            await summary.click();
            await page.keyboard.press('End');
            await page.keyboard.type(' DIAGX');
            await page.waitForTimeout(150);
            const after=await summary.textContent();
            const active=await page.evaluate(() => ({ cls:document.activeElement?.className || '', ce:document.activeElement?.contentEditable || '' }));
            console.log('TYPE_STATE', JSON.stringify({ beforeTail:before.slice(-40), afterTail:after.slice(-60), active }));
            assert.notEqual(after, before, 'typing should change description DOM');
            assert.match(after, /DIAGX/);
            assert.match(active.cls, /summary/);
            assert.equal(active.ce, 'true');

            await page.locator('#catalogue-direct-controls [data-direct="finish"]').click();
            await page.waitForTimeout(250);
            const finishState=await card.evaluate(el => ({
              compact:el.classList.contains('convenience-compact'),
              expanded:el.classList.contains('convenience-expanded'),
              marker:el.dataset.catalogueDirectWasCompact || '',
              summaryEditable:el.querySelector('.summary')?.contentEditable || ''
            }));
            console.log('FINISH_STATE', JSON.stringify(finishState));
            assert.equal(finishState.compact, true);
            assert.equal(finishState.expanded, false);
            assert.equal(finishState.marker, '');
            assert.equal(finishState.summaryEditable, 'false');
            assert.deepEqual(pageErrors, []);
            console.log('PRODUCTION_BROWSER_EDIT_VERIFIED', key);
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
