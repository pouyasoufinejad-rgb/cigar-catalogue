name: Recommendation subsections task harness

on:
  push:
    branches:
      - task/recommendation-subsections
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full npm test
        run: npm test
