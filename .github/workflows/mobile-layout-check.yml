name: Mobile layout check

# Renders the live production page in a real browser at phone widths and reports how many
# cards actually sit on a row. Every earlier check used a local copy of public/index.html
# served by a local server, which is not the same DOM: production carries the Worker's
# injected dynamic entries and the subsection module then moves cards between grids.
# Read-only, needs no secrets.

on:
  workflow_dispatch:
    inputs:
      widths:
        description: 'Comma-separated CSS viewport widths to measure'
        required: false
        default: '360,412,540,900'
        type: string
      neighbour_keys:
        description: 'Optional comma-separated card keys: report where each lands and what sits either side'
        required: false
        type: string

permissions:
  contents: read

jobs:
  measure:
    name: Measure the live page at phone widths
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: npm install --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - name: Measure
        env:
          WIDTHS: ${{ inputs.widths }}
        run: node scripts/measure-live-mobile-layout.mjs
      - name: Check the card country strip
        if: ${{ always() }}
        env:
          STRIP_NEIGHBOUR_KEYS: ${{ inputs.neighbour_keys }}
        run: node scripts/verify-live-card-strip.mjs
      - name: Check the size-variant system
        if: ${{ always() }}
        run: node scripts/verify-live-variants.mjs
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-${{ github.run_id }}
          path: |
            mobile-layout-*.png
            card-strip-*.png
            variant-*.png
          retention-days: 14
          if-no-files-found: warn
