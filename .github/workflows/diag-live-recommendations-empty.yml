name: Diagnose live Recommendation regression

on:
  push:
    branches: [diag/live-recommendations-empty]
    paths:
      - '.github/workflows/diag-live-recommendations-empty.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live Recommendation state and hydrated DOM
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cigar-catalogue.psncodex.workers.dev'
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/api/catalogue-overrides?diag=2" -o /tmp/state.json
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/?diag=2" -o /tmp/live.html
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const html = fs.readFileSync('/tmp/live.html','utf8');
          console.log('STATE_VERSION', state.version);
          const subs = Array.isArray(state.recommendationSubsections) ? state.recommendationSubsections : [];
          console.log('SUBSECTION_COUNT', subs.length, 'ENTRY_TOTAL', subs.reduce((n,s)=>n+(s.entryKeys||[]).length,0));
          console.log('RAW_ROOT_MARKER', html.includes('data-recommendation-subsections-root'));
          NODE

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME=$CHROME"
          if [[ -z "$CHROME" ]]; then
            echo '::error::No Chrome/Chromium available on runner.'
            exit 1
          fi
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom "$BASE/?diag=hydrated-$(date +%s)" > /tmp/hydrated.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/hydrated.html','utf8');
          const count = re => [...html.matchAll(re)].length;
          console.log('HYDRATED_ROOTS', count(/data-recommendation-subsections-root=/g));
          console.log('HYDRATED_SUBSECTIONS', count(/data-recommendation-subsection=/g));
          console.log('HYDRATED_REC_GRIDS', count(/recommendation-subsection-grid/g));
          for (const id of ['coronets','petit-panatelas','flavoured']) {
            const section = html.match(new RegExp(`<section[^>]*data-recommendation-subsection=["']${id}["'][\\s\\S]*?<\\/section>`, 'i'))?.[0] || '';
            console.log(`DOM_SUBSECTION ${id} present=${Boolean(section)} cards=${count.call(null, /<article\b[^>]*class=["'][^"']*\bcard\b[^"']*["'][^>]*>/g && /$^/g)}`);
            if (section) {
              console.log(`DOM_SUBSECTION ${id} articleCount=${[...section.matchAll(/<article\b/gi)].length} hidden=${/class=["'][^"']*\bhidden\b/i.test(section)}`);
            }
          }
          const examples = ['davidoff-primeros-escurio','blackened-m81-coronets','joya-black-cigarillo','rocky-patel-sun-grown-juniors','cao-bella-vanilla'];
          for (const key of examples) {
            const idx = html.indexOf(`data-key="${key}"`);
            const before = idx >= 0 ? html.slice(Math.max(0, idx-700), idx) : '';
            const tag = idx >= 0 ? html.slice(html.lastIndexOf('<article', idx), html.indexOf('>', idx)+1) : '';
            console.log(JSON.stringify({key, present:idx>=0, tag, inRecSubsection:/data-recommendation-subsection=/.test(before), inUnavailable:/unavailable-grid/.test(before), inHidden:/class=["'][^"']*\bhidden\b/.test(before)}));
          }
          NODE
