name: Diagnose live Recommendation regression

on:
  push:
    branches: [diag/live-recommendations-empty]
    paths:
      - '.github/workflows/diag-live-recommendations-empty.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate runtime injection source
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n --exclude-dir=node_modules --exclude='*.map' 'catalogue-runtime\.mjs' src public scripts .github || true
          grep -R -n --exclude-dir=node_modules --exclude='*.map' 'runtimeScript\|catalogue-runtime' src/index-core.js src/index.js || true
