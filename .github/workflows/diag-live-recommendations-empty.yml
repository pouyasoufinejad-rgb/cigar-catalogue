name: Diagnose live Recommendation regression

on:
  push:
    branches: [diag/live-recommendations-empty]
    paths:
      - '.github/workflows/diag-live-recommendations-empty.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime cache path and headers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cigar-catalogue.psncodex.workers.dev'
          echo '--- runtime references in source ---'
          grep -oE '<script[^>]+catalogue-runtime[^>]*>' public/index.html || true
          echo '--- live HTML runtime references ---'
          curl -fsS -H 'Cache-Control: no-cache' "$BASE/?diag=cache-$(date +%s)" | grep -oE '<script[^>]+catalogue-runtime[^>]*>' || true
          echo '--- HTML headers ---'
          curl -fsSI "$BASE/?diag=cache-headers" | grep -Ei '^(cache-control|etag|age|cf-cache-status|last-modified|content-type):' || true
          echo '--- runtime headers ---'
          curl -fsSI "$BASE/catalogue-runtime.mjs" | grep -Ei '^(cache-control|etag|age|cf-cache-status|last-modified|content-type):' || true
          echo '--- recommendation module headers ---'
          curl -fsSI "$BASE/catalogue-recommendation-subsections.mjs" | grep -Ei '^(cache-control|etag|age|cf-cache-status|last-modified|content-type):' || true
