name: Apply stock import implementation v2

on:
  push:
    branches:
      - fix/github-stock-import
    paths:
      - 'scripts/apply-stock-import-fix-v2.mjs'
      - '.github/workflows/apply-stock-import-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-stock-import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply implementation
        run: node scripts/apply-stock-import-fix-v2.mjs
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.js wrangler.jsonc scripts/refresh-retailer-stock.mjs .github/workflows/refresh-retailer-stock.yml
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            git commit -m 'Move stock refresh to GitHub crawler'
            git push origin HEAD:fix/github-stock-import
          fi
