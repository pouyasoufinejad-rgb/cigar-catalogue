name: Probe deployment credential names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-deploy-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate configured secret and repository variable names only
        shell: bash
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const secrets = JSON.parse(process.env.ALL_SECRETS_JSON || '{}');
          const vars = JSON.parse(process.env.ALL_VARS_JSON || '{}');
          console.log('Configured secret names:');
          for (const name of Object.keys(secrets).sort()) console.log(`SECRET_NAME=${name}`);
          console.log('Configured repository variable names:');
          for (const name of Object.keys(vars).sort()) console.log(`VAR_NAME=${name}`);
          NODE
