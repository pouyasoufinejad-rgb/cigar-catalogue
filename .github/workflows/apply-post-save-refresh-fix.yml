name: Apply post-save refresh performance fix

on:
  push:
    paths:
      - '.github/workflows/apply-post-save-refresh-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact post-save patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/catalogue-admin-unified-v139.mjs')
          text = path.read_text()
          old = """    await putState(plan.statePayload);\n    setStatus('Saved site-wide. Reloading…');\n    setTimeout(() => location.reload(), 250);"""
          new = """    await putState(plan.statePayload);\n    setStatus('Saved site-wide. Refreshing catalogue…');\n    await new Promise(resolve => setTimeout(resolve, 250));\n    await loadStateForBrowser({ showMessage: false, applyStructural: true });\n    if (!serverAvailableForBrowser) {\n      location.reload();\n      return;\n    }\n    modeForBrowser = 'edit';\n    draftSourceEditorial = null;\n    draftSourceStructural = null;\n    removeDraftOption();\n    rebuildCardSelectFromDom(key);\n    closeEditor();\n    saveButton.disabled = false;\n    reloadButton.disabled = false;\n    setStatus('Saved site-wide.');"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one post-save reload block; found {count}')
          path.write_text(text.replace(old, new, 1))
      - name: Run full test suite
        run: npm test
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- public/catalogue-admin-unified-v139.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalogue-admin-unified-v139.mjs
          git commit -m 'Refresh catalogue in place after editor saves'
          git push origin HEAD:main
