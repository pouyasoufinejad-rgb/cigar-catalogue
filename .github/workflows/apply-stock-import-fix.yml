name: Apply stock import implementation

on:
  push:
    branches: [fix/github-stock-import]
    paths:
      - '.github/workflows/apply-stock-import-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-stock-import
      - name: Add authenticated stock import and GitHub refresher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/index.js')
          text=path.read_text()
          anchor="""export async function handleStockCheck(request, env) {\n"""
          assert text.count(anchor)==1
          block=r'''const STOCK_IMPORT_RETAILERS = new Set(['CigarHut','Cigarworld','CigarBox','Firmin Cigars','The Index','Ubercigar']);
const STOCK_IMPORT_STATUSES = new Set(['in','out','unknown','delisted']);

function stockImportError(payload) {
  if (!isRecord(payload) || !isRecord(payload.results) || !isRecord(payload.meta)) return 'Stock snapshot must contain results and meta objects.';
  for (const [key, result] of Object.entries(payload.results)) {
    if (sanitiseKey(key) !== key || !isRecord(result)) return `Invalid stock result key: ${key}`;
    if (!STOCK_IMPORT_STATUSES.has(result.status) || !STOCK_IMPORT_STATUSES.has(result.lastAttemptStatus)) return `Invalid stock status for ${key}.`;
    for (const field of ['checkedAt','lastAttemptAt']) {
      if (!Number.isFinite(Number(result[field])) || Number(result[field]) < 0) return `Invalid ${field} for ${key}.`;
    }
    if (!Number.isFinite(Number(result.priceSchemaVersion)) || Number(result.priceSchemaVersion) < 1) return `Invalid price schema for ${key}.`;
    if (!Array.isArray(result.retailers)) return `Retailers must be an array for ${key}.`;
    for (const row of result.retailers) {
      if (!isRecord(row) || !STOCK_IMPORT_RETAILERS.has(row.retailer) || !STOCK_IMPORT_STATUSES.has(row.status)) return `Invalid retailer row for ${key}.`;
      if (!safeHttpUrl(row.url)) return `Invalid retailer URL for ${key}.`;
      if (own(row, 'price') && (!Number.isFinite(Number(row.price)) || Number(row.price) <= 0)) return `Invalid retailer price for ${key}.`;
    }
  }
  for (const field of ['lastRestockAt','lastFullAt']) {
    if (!Number.isFinite(Number(payload.meta[field])) || Number(payload.meta[field]) < 0) return `Invalid stock meta field: ${field}.`;
  }
  return '';
}

export async function handleStockImport(request, env) {
  if (request.method !== 'POST') return json({ error:'Method not allowed.' }, { status:405, headers:{ allow:'POST' } });
  const denied = await requireAdminWrite(request, env);
  if (denied) return denied;
  if (!env?.CATALOGUE_STATE) return json({ error:'CATALOGUE_STATE KV binding is unavailable.' }, { status:503 });
  const body = await request.text();
  if (new TextEncoder().encode(body).byteLength > MAX_STATE_BYTES) return json({ error:'Stock snapshot is too large.' }, { status:413 });
  let payload;
  try { payload = JSON.parse(body); }
  catch (_) { return json({ error:'Invalid JSON.' }, { status:400 }); }
  const error = stockImportError(payload);
  if (error) return json({ error }, { status:400 });
  await Promise.all([
    env.CATALOGUE_STATE.put(STOCK_RESULTS_KEY, JSON.stringify(payload.results)),
    env.CATALOGUE_STATE.put(STOCK_META_KEY, JSON.stringify(payload.meta))
  ]);
  return json({ ok:true, cards:Object.keys(payload.results).length, meta:payload.meta });
}

'''
          text=text.replace(anchor,block+anchor)
          route="""    if (url.pathname === '/api/stock') return handleStock(request, env);\n    if (url.pathname === '/api/stock/check') return handleStockCheck(request, env);\n"""
          replacement="""    if (url.pathname === '/api/stock') return handleStock(request, env);\n    if (url.pathname === '/api/stock/import') return handleStockImport(request, env);\n    if (url.pathname === '/api/stock/check') return handleStockCheck(request, env);\n"""
          assert text.count(route)==1
          path.write_text(text.replace(route,replacement))

          wrangler=Path('wrangler.jsonc')
          w=wrangler.read_text()
          old='''  ],\n  "triggers": {\n    "crons": ["15 2 * * *", "45 2 * * SUN"]\n  }\n}'''
          new='''  ]\n}'''
          assert old in w
          wrangler.write_text(w.replace(old,new))
          PY

          cat > scripts/refresh-retailer-stock.mjs <<'EOF'
          import {
            STOCK_META_KEY,
            STOCK_RESULTS_KEY,
            readStockCache,
            runStockCheck
          } from '../src/stock.js';

          const base = String(process.env.CATALOGUE_URL || 'https://cigar-catalogue.psncodex.workers.dev').replace(/\/$/, '');
          const token = String(process.env.CATALOGUE_ADMIN_TOKEN || '').trim();
          if (!token) throw new Error('CATALOGUE_ADMIN_TOKEN is required.');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function fetchOk(url, options = {}, attempts = 4) {
            let last;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, { redirect:'follow', ...options });
                if (response.ok) return response;
                last = new Error(`${url} returned HTTP ${response.status}`);
              } catch (error) { last = error; }
              if (attempt < attempts) await sleep(1500 * attempt);
            }
            throw last || new Error(`Failed to fetch ${url}`);
          }

          const [htmlResponse, stateResponse, stockResponse] = await Promise.all([
            fetchOk(`${base}/?github-stock-refresh=${Date.now()}`),
            fetchOk(`${base}/api/catalogue-overrides?github-stock-refresh=${Date.now()}`),
            fetchOk(`${base}/api/stock?github-stock-refresh=${Date.now()}`)
          ]);
          const html = await htmlResponse.text();
          const state = await stateResponse.json();
          const prior = await stockResponse.json();

          class MemoryKv {
            constructor(values) { this.values = new Map(Object.entries(values)); }
            async get(key) { return this.values.get(key) ?? null; }
            async put(key, value) { this.values.set(key, String(value)); }
          }
          const kv = new MemoryKv({
            [STOCK_RESULTS_KEY]:JSON.stringify(prior.results || {}),
            [STOCK_META_KEY]:JSON.stringify(prior.meta || { lastRestockAt:0, lastFullAt:0 })
          });
          const env = { CATALOGUE_STATE:kv };
          const now = Date.now();
          const run = await runStockCheck(env, state, 'full', { html, now, fetchImpl:fetch });
          const snapshot = await readStockCache(env);

          const hut = [];
          for (const [key, result] of Object.entries(snapshot.results || {})) {
            for (const row of result?.retailers || []) if (row.retailer === 'CigarHut') hut.push([key,row]);
          }
          const hutUnknown = hut.filter(([,row]) => row.status === 'unknown');
          const hutMissing = hut.filter(([,row]) => row.status !== 'delisted' && !Number.isFinite(Number(row.price)));
          console.log(`[github-stock] checked=${run.checked} CigarHut rows=${hut.length} unknown=${hutUnknown.length} missing-current-price=${hutMissing.length}`);
          if (hutUnknown.length || hutMissing.length) {
            for (const [key,row] of hutUnknown) console.error('CigarHut unknown', key, row.url);
            for (const [key,row] of hutMissing) console.error('CigarHut missing price', key, row.url, row.status);
            throw new Error('Refusing to import an incomplete CigarHut snapshot.');
          }

          let imported = false;
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(`${base}/api/stock/import`, {
                method:'POST',
                headers:{ authorization:`Bearer ${token}`, 'content-type':'application/json' },
                body:JSON.stringify(snapshot)
              });
              if (response.ok) {
                imported = true;
                break;
              }
              console.log(`[github-stock] import endpoint not ready: HTTP ${response.status} attempt ${attempt}`);
            } catch (error) {
              console.log(`[github-stock] import attempt ${attempt} failed: ${error.message}`);
            }
            await sleep(8000);
          }
          if (!imported) throw new Error('Could not import stock snapshot after deployment retries.');

          let verified = false;
          for (let attempt = 1; attempt <= 8; attempt += 1) {
            const response = await fetchOk(`${base}/api/stock?verify-import=${now}-${attempt}`);
            const live = await response.json();
            if (Number(live.meta?.lastFullAt) === Number(snapshot.meta.lastFullAt)) {
              verified = true;
              break;
            }
            await sleep(2000);
          }
          if (!verified) throw new Error('Imported stock snapshot did not read back from production.');

          const wise = snapshot.results?.['foundation-wise-man-maduro-lancero-half']?.retailers?.find(row => row.retailer === 'Cigarworld');
          console.log('[github-stock] Wise Man Cigarworld', wise);
          if (!wise || Math.abs(Number(wise.price) - 58.5) > 0.01) throw new Error(`Wise Man Cigarworld price is not A$58.50: ${JSON.stringify(wise)}`);
          console.log('[github-stock] production snapshot imported and verified');
          EOF

          cat > .github/workflows/refresh-retailer-stock.yml <<'EOF'
          name: Refresh retailer stock from GitHub

          on:
            workflow_dispatch:
            schedule:
              - cron: '15 2 * * *'
            push:
              branches: [main]
              paths:
                - 'src/index.js'
                - 'src/stock.js'
                - 'src/retailer-price.js'
                - 'scripts/refresh-retailer-stock.mjs'
                - '.github/workflows/refresh-retailer-stock.yml'
                - 'wrangler.jsonc'

          permissions:
            contents: read

          jobs:
            refresh:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              env:
                CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
                CATALOGUE_URL: https://cigar-catalogue.psncodex.workers.dev
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Crawl retailers and import verified snapshot
                  run: node scripts/refresh-retailer-stock.mjs
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.js wrangler.jsonc scripts/refresh-retailer-stock.mjs .github/workflows/refresh-retailer-stock.yml
          git commit -m 'Move stock refresh to GitHub crawler'
          git push origin HEAD:fix/github-stock-import
