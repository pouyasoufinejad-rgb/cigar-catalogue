name: Apply direct-edit convenience fix

on:
  push:
    branches:
      - fix/direct-edit-compact-visibility
    paths:
      - '.github/workflows/apply-direct-edit-convenience-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply ownership fix and run tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/catalogue-convenience.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  const expanded = isCardExpanded(browserState, key);\n  card.classList.toggle('convenience-compact', !expanded);\n  card.classList.toggle('convenience-expanded', expanded);`;
          const after = `  const directEditing = card.dataset.catalogueDirectWasCompact === '1';\n  const expanded = directEditing || isCardExpanded(browserState, key);\n  card.classList.toggle('convenience-compact', !expanded);\n  card.classList.toggle('convenience-expanded', expanded);`;
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one convenience render target, found ${count}`);
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          npm test
      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/apply-direct-edit-convenience-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalogue-convenience.mjs .github/workflows/apply-direct-edit-convenience-fix.yml
          git commit -m 'fix: keep direct-edit card expanded during convenience rendering'
          git push origin HEAD:fix/direct-edit-compact-visibility
