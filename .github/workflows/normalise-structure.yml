name: Normalise catalogue structure

# Runs the Production/Practical structure normaliser against live state on demand.
# The normaliser is the authority on card structure, so this is the remedy whenever
# something else has written structure and left it un-canonicalised.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the before/after for every card without writing to KV'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-production-publisher
  cancel-in-progress: false

jobs:
  normalise:
    name: Normalise live Production and Practical structure
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Normalise live structure
        env:
          NORMALISE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/normalise-live-card-structure.mjs
