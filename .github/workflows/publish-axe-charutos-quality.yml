name: Publish Axe Charutos Quality downgrade

on:
  push:
    paths:
      - .github/workflows/publish-axe-charutos-quality.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tests
        run: npm test
      - name: Publish request and verify KV/rendering
        run: node scripts/publish-live-catalogue-request.mjs catalogue-requests/2026-09-08-axe-charutos-quality-silver.json
      - name: Record publication
        run: |
          curl -fsS https://cigar-catalogue.psncodex.workers.dev/api/catalogue-overrides > /tmp/state.json
          node --input-type=module <<'NODE' > axe-charutos-publish-verified.txt
          import { readFileSync } from 'node:fs';
          const state = JSON.parse(readFileSync('/tmp/state.json', 'utf8'));
          const card = state.cards?.['alonso-menendez-axe-charutos'];
          if (!card || Number(card.quality) !== 6) throw new Error('Live Axe Charutos Quality is not 6 after publication.');
          console.log('Axe Charutos publication verified.');
          console.log(`quality=${card.quality}`);
          console.log(`strength=${card.strength}`);
          console.log(`flavour=${card.flavour}`);
          console.log(`size=${card.size}`);
          console.log(`laurel=${card.laurel}`);
          NODE
          rm .github/workflows/publish-axe-charutos-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add axe-charutos-publish-verified.txt .github/workflows/publish-axe-charutos-quality.yml
          git commit -m 'Verify Axe Charutos Quality downgrade live'
          git push
