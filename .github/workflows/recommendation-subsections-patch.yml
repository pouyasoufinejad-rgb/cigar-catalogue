name: Recommendation subsections scoped patch

on:
  push:
    branches:
      - task/recommendation-subsections
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/recommendation-subsections
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped patches
        run: |
          node scripts/apply-recommendation-subsections-task-patch.mjs
          node scripts/apply-recommendation-publisher-task-patch.mjs
          node scripts/patch-recommendation-test-mocks.mjs
      - name: Commit scoped changes
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/catalogue-admin-unified-v139.mjs public/catalogue-half-cohort.mjs scripts/publish-catalogue-request.mjs test/publish-catalogue-request.test.mjs
          git commit -m "test: round-trip recommendation subsection state"
          git push origin HEAD:task/recommendation-subsections
