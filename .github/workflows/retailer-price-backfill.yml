name: One-time retailer price backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  backfill:
    name: Refresh live retailer price cache
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
      CATALOGUE_URL: https://cigar-catalogue.psncodex.workers.dev
    steps:
      - name: Wait for price-aware frontend deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CATALOGUE_ADMIN_TOKEN:-}" ]]; then
            echo "::error::CATALOGUE_ADMIN_TOKEN repository Actions secret is not configured."
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 30); do
            source="$(curl -fsSL --max-time 15 "${CATALOGUE_URL}/catalogue-convenience.mjs?price_backfill=${GITHUB_SHA}" || true)"
            if grep -q 'retailerPriceForRow' <<<"${source}"; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "${ready}" != "1" ]]; then
            echo "::error::Live Worker did not expose the price-aware frontend during the deployment check."
            exit 1
          fi

      - name: Run full retailer stock and price refresh
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 240 \
            -X POST \
            -H "Authorization: Bearer ${CATALOGUE_ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"mode":"full"}' \
            "${CATALOGUE_URL}/api/stock/check")"

          printf '%s' "${response}" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True, data; print(f"Refreshed {data.get(chr(99)+chr(104)+chr(101)+chr(99)+chr(107)+chr(101)+chr(100), 0)} catalogue cards; retailer price cache updated.")'
