name: Inspect stale retailer rows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CATALOGUE_URL: https://cigar-catalogue.psncodex.workers.dev
    steps:
      - name: Inspect Tabernacle and CigarHut live cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "${CATALOGUE_URL}/api/stock?inspect=${GITHUB_SHA}" -o /tmp/stock.json
          curl -fsSL --max-time 30 "${CATALOGUE_URL}/?inspect=${GITHUB_SHA}" -o /tmp/catalogue.html
          python3 - <<'PY'
          import json,re,html
          stock=json.load(open('/tmp/stock.json')); raw=open('/tmp/catalogue.html',encoding='utf8',errors='replace').read()
          for key in ['tabernacle-broadleaf-corona','foundation-wise-man-maduro-lancero-half']:
              print('STOCK_ROW',key,json.dumps((stock.get('results') or {}).get(key),sort_keys=True))
          for key,result in (stock.get('results') or {}).items():
              if 'tabernacle' in key.lower() or any('tabernacle' in str(x).lower() for x in result.get('retailers',[])):
                  print('TABERNACLE_CACHE',key,json.dumps(result,sort_keys=True))
          cigarhut=[]
          for key,result in (stock.get('results') or {}).items():
              for row in result.get('retailers',[]):
                  if row.get('retailer')=='CigarHut':
                      cigarhut.append((key,row.get('status'),row.get('price'),row.get('url')))
          print('CIGARHUT_COUNT',len(cigarhut),'UNKNOWN',sum(s=='unknown' for _,s,_,_ in cigarhut),'MISSING_PRICE',sum(not isinstance(p,(int,float)) for _,_,p,_ in cigarhut))
          for row in cigarhut:
              if row[1]=='unknown' or not isinstance(row[2],(int,float)): print('UNRESOLVED',row)
          for m in re.finditer(r'<article\b[^>]*data-key=["\']tabernacle-broadleaf-corona["\'][^>]*>[\s\S]*?</article>',raw,re.I):
              card=m.group(0)
              print('TABERNACLE_LINKS',re.findall(r'href=["\']([^"\']+)',card,re.I))
          PY
