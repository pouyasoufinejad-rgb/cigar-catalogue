name: Verify retailer price backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify live retailer prices
    runs-on: ubuntu-latest
    env:
      CATALOGUE_URL: https://cigar-catalogue.psncodex.workers.dev
    steps:
      - name: Assert three-retailer price cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "${CATALOGUE_URL}/api/stock?verify=${GITHUB_SHA}" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          key = "foundation-wise-man-maduro-lancero-half"
          result = data.get("results", {}).get(key)
          assert result, f"missing stock cache result for {key}"
          rows = {row.get("retailer"): row for row in result.get("retailers", [])}
          expected = ["CigarHut", "The Index", "Cigarworld"]
          prices = {}
          for retailer in expected:
              row = rows.get(retailer)
              assert row, f"missing retailer row: {retailer}"
              price = row.get("price")
              assert isinstance(price, (int, float)) and price > 0, f"missing price for {retailer}: {row}"
              prices[retailer] = price
          assert len(set(prices.values())) >= 2, f"retailer prices were not independently captured: {prices}"
          print("Verified live retailer prices:", prices)
          '
