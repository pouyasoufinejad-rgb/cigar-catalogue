name: Diagnose CigarHut search structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect CigarHut search results
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact unresolved products in CigarHut search HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as htmllib, re, subprocess, urllib.parse
          cases = [
              ('liga-t52-coronets','https://www.cigarhut.com.au/liga-privada-t52-coronets-tins-10-cigars/'),
              ('oliva-serie-g','https://www.cigarhut.com.au/oliva-serie-g-cigarillos-tin-of-5-cameroon/'),
              ('wise-man','https://www.cigarhut.com.au/the-wise-man-maduro-lancero/'),
          ]
          ua='Cigar Catalogue Stock Checker/1.0'
          for key, product_url in cases:
              path=urllib.parse.urlparse(product_url).path
              slug=urllib.parse.unquote(path).strip('/').split('/')[-1].replace('-',' ').replace('_',' ')
              search='https://www.cigarhut.com.au/search.php?search_query='+urllib.parse.quote_plus(slug)
              out=f'/tmp/{key}.html'
              cp=subprocess.run(['curl','-L','-sS','--max-time','30','-A',ua,'-o',out,'-w','%{http_code}',search],capture_output=True,text=True)
              raw=open(out,encoding='utf-8',errors='replace').read()
              print('\nCASE', key)
              print('SEARCH', search)
              print('HTTP', cp.stdout, 'BYTES', len(raw), 'TARGET_PATH_COUNT', raw.lower().count(path.lower()))
              hrefs=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>', raw, re.I):
                  href=htmllib.unescape(m.group(1))
                  text=re.sub(r'<[^>]+>',' ',m.group(2))
                  text=re.sub(r'\s+',' ',htmllib.unescape(text)).strip()
                  if path.lower() in href.lower() or any(tok in text.lower() for tok in slug.lower().split()[:3]):
                      hrefs.append((href,text))
              print('MATCHING_ANCHORS', len(hrefs))
              for href,text in hrefs[:12]: print('ANCHOR', repr(href), repr(text[:180]))
              idx=raw.lower().find(path.lower())
              if idx >= 0:
                  snippet=raw[max(0,idx-1800):idx+3500]
                  text=re.sub(r'<script\b[^>]*>[\s\S]*?</script>',' ',snippet,flags=re.I)
                  text=re.sub(r'<style\b[^>]*>[\s\S]*?</style>',' ',text,flags=re.I)
                  text=re.sub(r'<[^>]+>',' | ',text)
                  text=re.sub(r'\s+',' ',htmllib.unescape(text)).strip()
                  print('TARGET_SNIPPET', text[:3000])
              else:
                  # show likely product-card text around strongest slug token
                  token=slug.split()[0] if slug.split() else ''
                  idx=raw.lower().find(token.lower()) if token else -1
                  snippet=raw[max(0,idx-1200):idx+3000] if idx>=0 else raw[:3000]
                  text=re.sub(r'<[^>]+>',' | ',snippet)
                  text=re.sub(r'\s+',' ',htmllib.unescape(text)).strip()
                  print('FALLBACK_SNIPPET', text[:2500])
          PY
