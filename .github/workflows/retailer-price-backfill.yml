name: Diagnose Cigarworld metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cigarworld structured product data
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 35 -A 'Cigar Catalogue Stock Checker/1.0' 'https://www.cigarworld.com.au/aud/categories/cigars/foundation-cigar-company/' -o /tmp/cigarworld.html
          python3 - <<'PY'
          import json,re,html
          raw=open('/tmp/cigarworld.html',encoding='utf8',errors='replace').read()
          for i,m in enumerate(re.finditer(r'<script\b[^>]*type\s*=\s*["\']application/ld\+json["\'][^>]*>([\s\S]*?)</script\s*>',raw,re.I)):
              text=html.unescape(m.group(1)).strip()
              try: data=json.loads(text)
              except Exception as e:
                  print('JSONLD_ERROR',i,str(e)); continue
              def visit(v):
                  if isinstance(v,list):
                      for x in v: visit(x)
                  elif isinstance(v,dict):
                      typ=v.get('@type')
                      types=typ if isinstance(typ,list) else [typ]
                      if any(str(x).lower()=='product' for x in types):
                          print('PRODUCT',repr(v.get('name')),json.dumps(v.get('offers'),sort_keys=True)[:1500])
                      for k,x in v.items():
                          if k!='offers': visit(x)
              visit(data)
          PY
