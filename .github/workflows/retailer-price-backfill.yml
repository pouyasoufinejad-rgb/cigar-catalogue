name: Refresh CigarHut after stock fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh and verify CigarHut rows
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
      CATALOGUE_URL: https://cigar-catalogue.psncodex.workers.dev
    steps:
      - name: Refresh until fixed Worker is live
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CATALOGUE_ADMIN_TOKEN:-}" ]]; then
            echo '::error::CATALOGUE_ADMIN_TOKEN is not configured.'
            exit 1
          fi

          improved=0
          for attempt in $(seq 1 12); do
            echo "Full stock refresh attempt ${attempt}"
            curl -fsS --max-time 240 \
              -X POST \
              -H "Authorization: Bearer ${CATALOGUE_ADMIN_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"mode":"full"}' \
              "${CATALOGUE_URL}/api/stock/check" > /tmp/refresh.json

            curl -fsS --max-time 30 "${CATALOGUE_URL}/api/stock?verify=${GITHUB_SHA}-${attempt}" > /tmp/stock.json
            read -r rows unknown missing < <(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/stock.json'))
          rows=[]
          for key,result in data.get('results',{}).items():
              for row in result.get('retailers',[]):
                  if row.get('retailer')=='CigarHut': rows.append((key,row))
          unknown=sum(1 for _,r in rows if r.get('status')=='unknown')
          missing=sum(1 for _,r in rows if not isinstance(r.get('price'),(int,float)))
          print(len(rows), unknown, missing)
          PY
            )
            echo "CigarHut rows=${rows} unknown=${unknown} missing_price=${missing}"
            if (( unknown < 33 )); then
              improved=1
              break
            fi
            sleep 5
          done

          if [[ "${improved}" != "1" ]]; then
            echo '::error::CigarHut unknown count did not improve from the pre-fix baseline of 33.'
            exit 1
          fi

      - name: Report final unresolved CigarHut rows
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "${CATALOGUE_URL}/api/stock?final=${GITHUB_SHA}" \
            | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          rows=[]
          for key,result in data.get("results",{}).items():
              for row in result.get("retailers",[]):
                  if row.get("retailer")=="CigarHut": rows.append((key,row))
          unknown=[(k,r) for k,r in rows if r.get("status")=="unknown"]
          missing=[(k,r) for k,r in rows if not isinstance(r.get("price"),(int,float))]
          print(f"FINAL CigarHut rows: {len(rows)}; unknown: {len(unknown)}; missing price: {len(missing)}")
          for key,row in unknown:
              print("UNKNOWN", key, row.get("url"), "price=", row.get("price"))
          for key,row in missing:
              print("NO_PRICE", key, row.get("url"), "status=", row.get("status"))
          '
