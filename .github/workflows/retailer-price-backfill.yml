name: Diagnose retailer extraction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retailer-price-backfill.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run extractor against live retailer HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --max-time 35 -A 'Cigar Catalogue Stock Checker/1.0' 'https://www.cigarworld.com.au/aud/categories/cigars/foundation-cigar-company/' -o /tmp/cigarworld.html
          curl -LfsS --max-time 35 -A 'Cigar Catalogue Stock Checker/1.0' 'https://www.cigarhut.com.au/liga-privada-t52-coronets-tins-10-cigars/' -o /tmp/hut-t52.html
          curl -LfsS --max-time 35 -A 'Cigar Catalogue Stock Checker/1.0' 'https://www.cigarhut.com.au/oliva-serie-g-cigarillos-tin-of-5-cameroon/' -o /tmp/hut-g.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { extractRetailerPrice } from './src/retailer-price.js';
          const cw=fs.readFileSync('/tmp/cigarworld.html','utf8');
          const t52=fs.readFileSync('/tmp/hut-t52.html','utf8');
          const g=fs.readFileSync('/tmp/hut-g.html','utf8');
          const cases=[
            ['CW wise man',cw,{title:'Foundation The Wise Man Maduro Lancero',packageLabel:'single full lancero',packagePrice:49}],
            ['CW wise man no brand',cw,{title:'The Wise Man Maduro Lancero',packageLabel:'single full lancero',packagePrice:49}],
            ['Hut T52',t52,{title:'Liga Privada T52 Coronets',packageLabel:'tin of 10',packagePrice:113}],
            ['Hut Oliva G',g,{title:'Oliva Serie G Cigarillos',packageLabel:'tin of 5',packagePrice:96}],
          ];
          for (const [name,html,context] of cases) console.log('EXTRACT',name,extractRetailerPrice(html,context));
          const needle='THE WISE MAN MADURO - LANCERO - Single';
          const idx=cw.toLowerCase().indexOf(needle.toLowerCase());
          console.log('CW_NEEDLE_INDEX',idx);
          if (idx>=0) console.log('CW_HTML_SNIPPET',cw.slice(Math.max(0,idx-1800),idx+3500).replace(/\s+/g,' ').slice(0,5200));
          NODE
