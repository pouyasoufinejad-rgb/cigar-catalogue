name: Restore pre-sidebar Arturito catalogue

on:
  pull_request:
    paths:
      - '.github/workflows/restore-pre-sidebar-arturito.yml'
      - '.github/workflows/publish-catalogue.yml'
      - 'scripts/restore-pre-sidebar-arturito.mjs'
      - 'test/restore-pre-sidebar-arturito.test.mjs'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'wrangler.jsonc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-pre-sidebar-arturito.yml'
      - '.github/workflows/publish-catalogue.yml'
      - 'scripts/restore-pre-sidebar-arturito.mjs'
      - 'test/restore-pre-sidebar-arturito.test.mjs'
      - 'public/**'
      - 'src/**'
      - 'package.json'
      - 'wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-pre-sidebar-restore
  cancel-in-progress: false

jobs:
  verify:
    name: Verify pre-sidebar rollback
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run full test suite
        run: npm test
      - name: Dry-run against live catalogue
        run: node scripts/restore-pre-sidebar-arturito.mjs --dry-run-live

  restore:
    name: Apply and verify pre-sidebar KV state
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded restore and read back production
        run: node scripts/restore-pre-sidebar-arturito.mjs --apply
