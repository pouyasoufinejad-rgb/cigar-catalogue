name: Apply exact CigarHut search implementation

on:
  push:
    branches:
      - fix/cigarhut-exact-search
    paths:
      - '.github/workflows/apply-cigarhut-exact-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cigarhut-exact-search
      - name: Patch crawler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/stock.js')
          text=path.read_text()
          text=text.replace('async function runProductPass(cardPlans, fetchImpl, counters) {','async function runProductPass(cardPlans, fetchImpl, counters, options = {}) {',1)
          needle="""        let directNotFound = false;\n        try {\n          const page = await fetchPage(link.url, fetchImpl, true);\n"""
          insert="""        if (link.retailer === 'CigarHut' && options.cigarHutExactSearch) {\n          let searchChecked = false;\n          try {\n            const recovered = await recoverCigarhutListing(plan, link, fetchImpl);\n            searchChecked = true;\n            if (recovered) {\n              if (['in','out'].includes(recovered.status)) status = recovered.status;\n              const recoveredPrice = positivePrice(recovered.price, 0);\n              if (recoveredPrice) price = recoveredPrice;\n              plan.retailerResults[linkIndex] = { retailer:link.retailer, status, url:link.url, ...(positivePrice(price, 0) ? { price } : {}) };\n              if (status === 'unknown') counters.failed++;\n              else counters.productResolved++;\n              return;\n            }\n          } catch (_) {}\n\n          try {\n            const page = await fetchPage(link.url, fetchImpl, true);\n            if (page.targetStatus === 404) {\n              status = 'delisted';\n              price = null;\n              counters.delistingCandidates.set(plan.key, plan.title || plan.key);\n            } else if (searchChecked) {\n              status = 'out';\n              const currentPrice = extractRetailerPrice(page.html, plan);\n              if (currentPrice != null) price = currentPrice;\n            }\n          } catch (_) {\n            status = 'unknown';\n          }\n          plan.retailerResults[linkIndex] = { retailer:link.retailer, status, url:link.url, ...(positivePrice(price, 0) ? { price } : {}) };\n          if (status === 'unknown') counters.failed++;\n          else counters.productResolved++;\n          return;\n        }\n\n        let directNotFound = false;\n        try {\n          const page = await fetchPage(link.url, fetchImpl, true);\n"""
          if needle not in text: raise SystemExit('product-pass insertion anchor not found')
          text=text.replace(needle,insert,1)
          old="""  const counters = { sweepResolved:0, productResolved:0, failed:0, delistingCandidates:new Map() };\n  await runCategorySweep(plans, fetchImpl, counters);\n  await runProductPass(plans, fetchImpl, counters);\n"""
          new="""  const counters = { sweepResolved:0, productResolved:0, failed:0, delistingCandidates:new Map() };\n  if (!options.cigarHutExactSearch) await runCategorySweep(plans, fetchImpl, counters);\n  await runProductPass(plans, fetchImpl, counters, options);\n"""
          if old not in text: raise SystemExit('runStockCheck anchor not found')
          text=text.replace(old,new,1)
          path.write_text(text)

          refresh=Path('scripts/refresh-retailer-stock.mjs')
          r=refresh.read_text()
          old="const run = await runStockCheck(env, state, 'full', { html, now, fetchImpl: fetch });"
          new="const run = await runStockCheck(env, state, 'full', { html, now, fetchImpl: fetch, cigarHutExactSearch: true });"
          if old not in r: raise SystemExit('refresh script anchor not found')
          refresh.write_text(r.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/stock.js scripts/refresh-retailer-stock.mjs
          git commit -m 'Use exact CigarHut search in GitHub refresh'
          git push origin HEAD:fix/cigarhut-exact-search
