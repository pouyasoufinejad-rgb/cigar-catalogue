name: Verify full catalogue editor in Chromium

on:
  push:
    branches:
      - diag/full-editor-browser-verify-v141

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify full structured editor on production
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:1440, height:1200 } });
            const pageErrors=[];
            page.on('pageerror', e => pageErrors.push(String(e)));
            const base='https://cigar-catalogue.psncodex.workers.dev/';
            await page.goto(base+'?verify_full_editor_production=141', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(1200);

            const runtime = await page.evaluate(() => Array.from(document.scripts).map(s => s.src).find(src => src.includes('catalogue-runtime.mjs')) || '');
            assert.match(runtime, /catalogue-runtime\.mjs\?v=141/);
            const runtimeBody = await (await page.request.get(base+'catalogue-runtime.mjs?v=141&verify=production')).text();
            assert.doesNotMatch(runtimeBody, /catalogue-direct-edit\.mjs/);

            const toggle = page.locator('#catalogue-admin-toggle');
            await toggle.click();
            await page.waitForTimeout(500);

            const modal = page.locator('#catalogue-admin');
            assert.equal(await modal.getAttribute('hidden'), null, 'full catalogue editor modal should be open');
            assert.equal(await page.locator('body.catalogue-direct-edit-mode').count(), 0, 'legacy direct edit mode must not activate');

            for (const selector of [
              '#catalogue-admin-card', '#catalogue-v139-brand', '#catalogue-v139-title', '#catalogue-v139-price',
              '#catalogue-v139-country', '#catalogue-v139-length', '#catalogue-v139-ring',
              '#catalogue-admin-strength', '#catalogue-admin-quality', '#catalogue-admin-section', '#catalogue-admin-save'
            ]) {
              const field = page.locator(selector);
              assert.equal(await field.count(), 1, `expected ${selector}`);
              assert.equal(await field.isVisible(), true, `${selector} should be visible`);
            }

            const select = page.locator('#catalogue-admin-card');
            const key = await select.evaluate(el => Array.from(el.options).map(o => o.value).find(v => v && !v.startsWith('__')) || '');
            assert.ok(key, 'expected at least one real cigar option');
            await select.selectOption(key);
            await page.waitForTimeout(350);

            const brand = page.locator('#catalogue-v139-brand');
            const title = page.locator('#catalogue-v139-title');
            const price = page.locator('#catalogue-v139-price');
            const before = { brand: await brand.inputValue(), title: await title.inputValue(), price: await price.inputValue() };
            assert.ok(before.brand, 'selected card should populate Brand');
            assert.ok(before.title, 'selected card should populate Title');

            await brand.fill(before.brand + ' DIAG');
            await title.fill(before.title + ' DIAG');
            await price.fill('12.34');
            assert.equal(await brand.inputValue(), before.brand + ' DIAG');
            assert.equal(await title.inputValue(), before.title + ' DIAG');
            assert.equal(await price.inputValue(), '12.34');
            assert.equal(await page.locator('#catalogue-admin-save').isEnabled(), true, 'Save should be enabled for selected card');

            console.log('PRODUCTION_FULL_EDITOR_VERIFIED', JSON.stringify({ key, before, runtime }));
            assert.deepEqual(pageErrors, []);
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
