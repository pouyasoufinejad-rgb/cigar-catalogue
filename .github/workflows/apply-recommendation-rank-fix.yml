name: Apply targeted Recommendation rank fix

on:
  push:
    branches:
      - fix/recommendation-rank-edit
    paths:
      - '.github/workflows/apply-recommendation-rank-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recommendation-rank-edit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only Recommendation rank save logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          admin = Path('public/catalogue-admin-unified-v139.mjs')
          text = admin.read_text(encoding='utf-8')

          marker = "export function actionFromTarget(target) {"
          helper = """export function rankingUpdatesForSave(cards, existingCards, options = {}) {\n  const targetCatalogueType = String(options.targetCatalogueType || '').trim().toLowerCase();\n  const explicitRecommendation = targetCatalogueType === 'main'\n    && (Number(options.stateVersion) >= 4 || Array.isArray(options.recommendationSubsections));\n  if (explicitRecommendation) return {};\n  return reorderCohortOverrides(cards, existingCards, options);\n}\n\n"""
          if 'export function rankingUpdatesForSave' not in text:
              if marker not in text:
                  raise SystemExit('actionFromTarget marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = """    const rankUpdates = reorderCohortOverrides(rows, stateForBrowser.cards, {\n      key, taster: structural.taster, wantsArchived, targetRank: q('catalogue-admin-rank').value, now:new Date().toISOString()\n    });"""
          new = """    const rankUpdates = rankingUpdatesForSave(rows, stateForBrowser.cards, {\n      key,\n      taster: structural.taster,\n      wantsArchived,\n      targetRank: q('catalogue-admin-rank').value,\n      now: new Date().toISOString(),\n      stateVersion: stateForBrowser.version,\n      recommendationSubsections: stateForBrowser.recommendationSubsections,\n      targetCatalogueType: q('catalogue-v139-type').value\n    });"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('rankUpdates call site not found')
          admin.write_text(text, encoding='utf-8')

          roots = [Path('public'), Path('scripts'), Path('src'), Path('test')]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.mjs', '.js'}:
                      continue
                  source = path.read_text(encoding='utf-8')
                  updated = source.replace('20260914-v7', '20260914-v8')
                  updated = updated.replace('Live v7 runtime', 'Live v8 runtime')
                  updated = updated.replace('the v7 runtime', 'the v8 runtime')
                  updated = updated.replace('missing the v7 runtime', 'missing the v8 runtime')
                  updated = updated.replace('missing the v7 ', 'missing the v8 ')
                  updated = updated.replace('v7 runtime bootstrap', 'v8 runtime bootstrap')
                  if updated != source:
                      path.write_text(updated, encoding='utf-8')
          PY
          npm test
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts src test
          git commit -m 'fix: allow Recommendation rank edits in v4'
          git push origin HEAD:fix/recommendation-rank-edit
