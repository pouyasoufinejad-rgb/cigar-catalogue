name: Verify catalogue Worker deployment

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'public/**'
      - 'src/**'
      - 'scripts/verify-live-code-ready.mjs'
      - 'scripts/verify-live-next-ui.mjs'
      - 'scripts/verify-live-recommendation-v4.mjs'
      - 'scripts/build-recommendation-subsections-migration.mjs'
      - 'test/**'
      - 'wrangler.jsonc'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'public/**'
      - 'src/**'
      - 'scripts/verify-live-code-ready.mjs'
      - 'scripts/verify-live-next-ui.mjs'
      - 'scripts/verify-live-recommendation-v4.mjs'
      - 'scripts/build-recommendation-subsections-migration.mjs'
      - 'test/**'
      - 'wrangler.jsonc'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-worker-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Test Worker deploy candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test

  verify-live:
    name: Verify Cloudflare Workers Build
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for rebuilt catalogue UI to be live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if node scripts/verify-live-next-ui.mjs; then
              exit 0
            fi
            sleep 6
          done
          echo "::error::Cloudflare Workers Build did not expose the rebuilt catalogue UI and verified v4 state."
          exit 1
      - name: Build fresh read-only migration candidate from deployed production
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-recommendation-subsections-migration.mjs | tee recommendation-subsections-migration-candidate.json
      - name: Upload post-deploy migration candidate
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-subsections-migration-candidate-post-deploy
          path: recommendation-subsections-migration-candidate.json
          retention-days: 1
          if-no-files-found: error
