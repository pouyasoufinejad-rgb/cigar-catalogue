name: Deploy catalogue Worker

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'test/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cigar-catalogue-worker-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Test Worker deploy candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: npm test

  deploy:
    name: Deploy and verify pre-sidebar Worker
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is not configured."
            exit 1
          fi
      - name: Deploy rolled-back Worker and assets
        run: npm run deploy
      - name: Verify rolled-back application and KV are live
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'https://cigar-catalogue.psncodex.workers.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchText(path) {
            const url = `${base}${path}${path.includes('?') ? '&' : '?'}deploy_verify=${Date.now()}-${Math.random()}`;
            const response = await fetch(url, { cache:'no-store' });
            const body = await response.text();
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}: ${body.slice(0, 200)}`);
            return body;
          }

          async function verify() {
            const sidebar = await fetchText('/catalogue-control-sidebar.mjs');
            assert.equal(sidebar.includes('BRAND_LINE_CONFIG'), false, 'Sep 17 BRAND_LINE_CONFIG is still live.');
            assert.equal(sidebar.includes('BRAND_LINE_QUERY_PARAM'), false, 'Sep 17 brandLine filter code is still live.');
            assert.match(sidebar, /catalogue-control-sidebar-style-v1/, 'Pre-sidebar sidebar module is not live.');

            const state = JSON.parse(await fetchText('/api/catalogue-overrides'));
            assert.equal(Object.keys(state.entries || {}).length, 50, 'Expected 50 restored entries.');
            assert.equal(Object.keys(state.cards || {}).length, 95, 'Expected 95 restored card overrides.');
            assert.equal(Object.keys(state.sections || {}).length, 3, 'Expected 3 restored sections.');
            assert.equal(state.sections?.brandLogos, undefined, 'Sidebar brand logo state is still present.');
            assert.equal(state.sections?.hiddenBrands, undefined, 'Sidebar hidden-brand state is still present.');
            assert.match(String(state.cards?.['arturo-fuente-exquisitos-maduro']?.title || state.entries?.['arturo-fuente-exquisitos-maduro']?.title || ''), /Arturito/i, 'Arturito fingerprint is missing.');
            assert.equal(state.entries?.['drew-estate-acid-krush-red-cameroon']?.title, 'ACID Krush Red Cameroon', 'ACID entry is missing.');

            const html = await fetchText('/');
            assert.match(html, /Arturito/i, 'Rendered catalogue is missing Arturito.');
            assert.match(html, /data-key=["']drew-estate-acid-krush-red-cameroon["']/i, 'Rendered catalogue is missing ACID Krush Red Cameroon.');
          }

          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              await verify();
              console.log('PRE_SIDEBAR_WORKER_DEPLOY_VERIFIED');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`verification attempt ${attempt} not ready: ${error.message}`);
              if (attempt < 12) await sleep(5000);
            }
          }
          throw lastError;
          NODE
