name: Apply initial hydration performance fix

on:
  push:
    paths:
      - '.github/workflows/apply-initial-hydration-performance-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact hydration patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/catalogue-admin-unified-v139.mjs')
          text = path.read_text()
          replacements = [
              (
                  'async function loadStateForBrowser(showMessage = false) {',
                  'async function loadStateForBrowser({ showMessage = false, applyStructural = true } = {}) {'
              ),
              (
                  '      applyStructuralOverrideToCard(card, effectiveStructure(card, stateForBrowser));',
                  '      if (applyStructural) applyStructuralOverrideToCard(card, effectiveStructure(card, stateForBrowser));'
              ),
              (
                  '  await loadStateForBrowser(true);',
                  '  await loadStateForBrowser({ showMessage: true, applyStructural: true });'
              ),
              (
                  '  window.catalogueOverridesReady = loadStateForBrowser(false).then(() => {',
                  '  window.catalogueOverridesReady = loadStateForBrowser({ applyStructural: false }).then(() => {'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Run full test suite
        run: npm test
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- public/catalogue-admin-unified-v139.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalogue-admin-unified-v139.mjs
          git commit -m 'Avoid redundant structural hydration on initial load'
          git push origin HEAD:main
