name: Axe Charutos exception RED

on:
  push:
    paths:
      - .github/workflows/axe-charutos-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read live catalogue state
        run: |
          curl -fsS https://cigar-catalogue.psncodex.workers.dev/api/catalogue-overrides > /tmp/catalogue-overrides.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const state = JSON.parse(readFileSync('/tmp/catalogue-overrides.json', 'utf8'));
          const key = 'alonso-menendez-axe-charutos';
          const card = state.cards?.[key] || state.entries?.[key] || null;
          console.log(JSON.stringify({ key, card }, null, 2));
          NODE

      - name: Add regression tests in runner only
        run: |
          python3 <<'PY'
          from pathlib import Path

          flavour = Path('test/flavour-rating.test.mjs')
          text = flavour.read_text()
          marker = "test('browser runtime loads Flavour UI, card hydration and save interception'"
          addition = r'''test('Axe Charutos quality exception preserves Gem qualification without promoting other cigars', () => {
            const qualifying = { strength: 7, quality: 6, flavour: 7, size: 'gold', value: 5 };
            assert.equal(deriveAutoLaurel({ key: 'alonso-menendez-axe-charutos', ...qualifying }), 'gem');
            assert.equal(deriveAutoLaurel({ key: 'ordinary-cigar', ...qualifying }), 'crown');
          });

          '''
          if marker not in text:
            raise SystemExit('flavour test marker not found')
          flavour.write_text(text.replace(marker, addition + marker, 1))

          elite = Path('test/elite-flavour-gating.test.mjs')
          text = elite.read_text()
          text = text.replace(
            "function fakeCard(ratings = [], rank = 1) {\n  return {\n    dataset: { rank: String(rank), stock: 'in' },",
            "function fakeCard(ratings = [], rank = 1, key = '') {\n  return {\n    dataset: { rank: String(rank), stock: 'in', key },",
            1
          )
          marker = "test('rated non-Gold flavour moves an otherwise Elite card to Strong'"
          addition = r'''test('Axe Charutos quality exception preserves Elite placement only for that card', () => {
            const labels = ['strength', 'flavour'];
            assert.equal(presentation.recommendationDestination(labels, {
              flavourRated: true,
              key: 'alonso-menendez-axe-charutos'
            }), 'elite');
            assert.equal(presentation.recommendationDestination(labels, {
              flavourRated: true,
              key: 'ordinary-cigar'
            }), 'strong');
            assert.equal(presentation.recommendationDestination(['strength', 'size'], {
              flavourRated: false,
              key: 'alonso-menendez-axe-charutos'
            }), 'elite');

            const axe = fakeCard([
              fakeRating('Strength', ['gold']),
              fakeRating('Quality', ['silver']),
              fakeRating('Flavour', ['gold'])
            ], 1, 'alonso-menendez-axe-charutos');
            assert.equal(presentation.recommendationDestinationForCard(axe), 'elite');
          });

          '''
          if marker not in text:
            raise SystemExit('elite test marker not found')
          elite.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Verify regression tests fail before implementation
        shell: bash
        run: |
          set +e
          node --test test/flavour-rating.test.mjs test/elite-flavour-gating.test.mjs > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED tests to fail, but they passed.' >&2
            exit 1
          fi
          grep -q 'Axe Charutos quality exception preserves Gem qualification' /tmp/red.log
          grep -q 'Axe Charutos quality exception preserves Elite placement' /tmp/red.log
          echo 'RED verified: both Axe Charutos regressions fail on the current implementation.'
