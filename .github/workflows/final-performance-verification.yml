name: Final performance verification

on:
  push:
    paths:
      - '.github/workflows/final-performance-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full test suite
        run: npm test
      - name: Verify optimized module is live
        shell: bash
        run: |
          set -euo pipefail
          base='https://cigar-catalogue.psncodex.workers.dev'
          curl -fsS "$base/catalogue-admin-unified-v139.mjs?final_verify=${GITHUB_SHA}" -o /tmp/admin.mjs
          grep -Fq 'async function loadStateForBrowser({ showMessage = false, applyStructural = true } = {})' /tmp/admin.mjs
          grep -Fq 'loadStateForBrowser({ applyStructural: false })' /tmp/admin.mjs
          curl -fsS "$base/api/catalogue-overrides" -o /tmp/state.json
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          console.log(`live_cards=${Object.keys(s.cards || {}).length} live_entries=${Object.keys(s.entries || {}).length} updatedAt=${s.updatedAt || ''}`);
          NODE
