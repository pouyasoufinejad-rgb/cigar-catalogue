name: Verify post-save catalogue performance

on:
  push:
    paths:
      - '.github/workflows/verify-post-save-performance.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full test suite
        run: npm test
      - name: Verify optimized editor is live and KV was not rewritten
        shell: bash
        run: |
          set -euo pipefail
          base='https://cigar-catalogue.psncodex.workers.dev'
          live=0
          for attempt in $(seq 1 12); do
            curl -fsS "$base/catalogue-admin-unified-v139.mjs?post_save_verify=$attempt" -o /tmp/admin.mjs
            if grep -Fq "await loadStateForBrowser({ showMessage: false, applyStructural: true });" /tmp/admin.mjs \
              && grep -Fq "loadStateForBrowser({ applyStructural: false })" /tmp/admin.mjs \
              && ! grep -Fq "setTimeout(() => location.reload(), 250)" /tmp/admin.mjs; then
              live=1
              echo "optimized_post_save_live=1 attempt=$attempt"
              break
            fi
            echo "optimized_post_save_live=0 attempt=$attempt"
            sleep 5
          done
          test "$live" = 1
          curl -fsS "$base/api/catalogue-overrides" -o /tmp/state.json
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/state.json', 'utf8'));
          console.log(`live_cards=${Object.keys(s.cards || {}).length} live_entries=${Object.keys(s.entries || {}).length} updatedAt=${s.updatedAt || ''}`);
          NODE
