name: Audit subsection retailer links
on:
  workflow_dispatch:
    inputs:
      subsection:
        description: 'Recommendation subsection id'
        required: false
        default: 'petit-panatelas'
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          SUBSECTION_ID: ${{ inputs.subsection }}
        run: node scripts/audit-panatela-retailer-links.mjs
