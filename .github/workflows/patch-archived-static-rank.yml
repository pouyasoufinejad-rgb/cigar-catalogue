name: Apply archived static rank verifier fix

on:
  push:
    branches: [fix/v4-archived-static-rank-verifier]
    paths:
      - '.github/workflows/patch-archived-static-rank.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-archived-static-rank-verifier
      - name: Patch effective ranking merge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/publish-catalogue-request.mjs')
          text = path.read_text()
          old = """  for (const [key, override] of Object.entries(state.cards || {})) {\n    cards[key] = { ...(cards[key] || {}), ...stripDerivedCardValue(override) };\n  }\n  return cards;\n}"""
          new = """  for (const [key, override] of Object.entries(state.cards || {})) {\n    cards[key] = { ...(cards[key] || {}), ...stripDerivedCardValue(override) };\n  }\n  for (const card of Object.values(cards)) {\n    if (card?.archived) delete card.rank;\n  }\n  return cards;\n}"""
          if text.count(old) != 1:
              raise SystemExit('Expected completeRankingCards merge block not found exactly once.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- scripts/publish-catalogue-request.mjs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-catalogue-request.mjs
          git commit -m "Fix archived static rank in v4 verification"
          git push origin HEAD:fix/v4-archived-static-rank-verifier
