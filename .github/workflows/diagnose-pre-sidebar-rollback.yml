name: Diagnose exact pre-sidebar rollback source

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-pre-sidebar-rollback.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture current live catalogue state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://cigar-catalogue.psncodex.workers.dev/api/catalogue-overrides?diag=exact-pre-sidebar-rollback' -o live-state.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('live-state.json','utf8'));
          const entries=s.entries||{}, cards=s.cards||{}, sections=s.sections||{};
          const fields=['brand','title','eyebrow','packagePrice','packageLabel','price','country','length','ring','strength','quality','risk','stock','experienceTags','summaryHtml','noteHtml','productionLines','practicalLines','smokeTime','retailerLinks','priceChecked','stockChecked'];
          const missing={};
          for (const f of fields) missing[f]=Object.values(entries).filter(e=>e?.[f]===undefined || e?.[f]===null || (Array.isArray(e?.[f])&&e[f].length===0) || (typeof e?.[f]==='string'&&!e[f].trim())).length;
          console.log('LIVE_COUNTS', JSON.stringify({entries:Object.keys(entries).length,cards:Object.keys(cards).length,sections:Object.keys(sections).length,sectionKeys:Object.keys(sections)}));
          console.log('ENTRY_MISSING_COUNTS', JSON.stringify(missing));
          const entryFieldCounts={}; const cardFieldCounts={}; const extraByEntry={};
          for (const [key,e] of Object.entries(entries)) {
            for (const k of Object.keys(e||{})) entryFieldCounts[k]=(entryFieldCounts[k]||0)+1;
            const c=cards[key]||{};
            for (const k of Object.keys(c)) cardFieldCounts[k]=(cardFieldCounts[k]||0)+1;
            extraByEntry[key]=Object.keys(c).filter(k=>!(k in (e||{}))).sort();
          }
          console.log('ENTRY_FIELD_COUNTS', JSON.stringify(entryFieldCounts));
          console.log('DYNAMIC_CARD_FIELD_COUNTS', JSON.stringify(cardFieldCounts));
          console.log('CARD_FIELDS_ABSENT_FROM_ENTRIES', JSON.stringify(extraByEntry));
          console.log('SUBSECTIONS', JSON.stringify((sections.recommendationSubsections||[]).map(x=>({id:x.id,title:x.title,entryKeys:x.entryKeys}))));
          console.log('LIVE_UPDATED_AT', s.updatedAt||'');
          NODE
      - name: Inspect rendered live catalogue
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://cigar-catalogue.psncodex.workers.dev/?diag=render-rollback' -o live.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('live.html','utf8');
          const arts=[...h.matchAll(/<article\b[^>]*\bdata-key=["']([^"']+)["'][^>]*>/gi)];
          const keys=arts.map(m=>m[1]);
          const dynamic=[...h.matchAll(/<article\b[^>]*\bdata-dynamic-entry=["']1["'][^>]*\bdata-key=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1]);
          const missingIdentity=[];
          for(const key of keys){
            const rx=new RegExp('<article\\b[^>]*\\bdata-key=["\\\']'+key+'["\\\'][^>]*>([\\s\\S]*?)<\\/article>','i');
            const body=h.match(rx)?.[1]||'';
            if(!/<h3>/i.test(body)||!/<p class=["']summary["']/i.test(body)) missingIdentity.push(key);
          }
          console.log('RENDER_COUNTS',JSON.stringify({articles:keys.length,unique:new Set(keys).size,dynamic:dynamic.length,duplicates:keys.filter((k,i)=>keys.indexOf(k)!==i).slice(0,20),missingIdentity:missingIdentity.slice(0,50)}));
          console.log('RENDER_HAS_ARTURITO',/Arturito/i.test(h));
          console.log('RENDER_HAS_ACID_RED',/Krush Red Cameroon/i.test(h));
          NODE
      - name: Compare live state to pre-sidebar request ledger
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/target-requests
          mkdir -p /tmp/target-requests
          git archive 8ba8f65754b37d5973331e55be0e9e9d5d306cf5 catalogue-requests | tar -x -C /tmp/target-requests
          cp live-state.json /tmp/live-state.json
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const root='/tmp/target-requests/catalogue-requests';
          const state=JSON.parse(fs.readFileSync('/tmp/live-state.json','utf8'));
          const files=fs.readdirSync(root).filter(x=>x.endsWith('.json')).sort();
          const ledger=new Map();
          for(const name of files){
            const r=JSON.parse(fs.readFileSync(path.join(root,name),'utf8'));
            if(!r.key) continue;
            const cur=ledger.get(r.key)||{entry:{},ops:[]};
            cur.ops.push({name,operation:r.operation});
            if(r.operation==='upsert-entry') Object.assign(cur.entry,r.entry||{});
            else if(r.operation==='archive-entry') Object.assign(cur.entry,{archived:true});
            else if(r.operation==='unarchive-entry') Object.assign(cur.entry,{archived:false});
            ledger.set(r.key,cur);
          }
          const ENTRY_FIELDS=new Set(['brand','title','eyebrow','packagePrice','packageLabel','price','length','ring','country','strength','quality','size','risk','stock','stockPin','rank','taster','archived','archivedAt','experienceTags','summaryHtml','noteHtml','productionLines','practicalLines','smokeTime','retailerLinks','imageUrl','imageSourceKey','imageVersion','priceChecked','stockChecked']);
          const CARD_ONLY=new Set(['catalogueType','subsection','flavour','laurel','archivedRank','imageScale','imageX','imageY','metaY','productionHtml','practicalHtml']);
          const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const mismatches=[];
          for(const [key,row] of ledger){
            const e=state.entries?.[key]||null, c=state.cards?.[key]||{};
            if(!e && !state.cards?.[key]) { mismatches.push({key,field:'__missing__',expected:'present',actual:'absent'}); continue; }
            for(const [field,expected] of Object.entries(row.entry)){
              if(field==='value') continue;
              let actual, source;
              if(field==='subsection'){
                const sec=(state.sections?.recommendationSubsections||[]).find(s=>Array.isArray(s.entryKeys)&&s.entryKeys.includes(key));
                actual=c.subsection||sec?.id||'';
                source='card/sections';
              } else if(CARD_ONLY.has(field)){
                actual=c[field]; source='card';
              } else if(ENTRY_FIELDS.has(field)){
                actual=e?.[field]; source='entry';
              } else {
                continue;
              }
              if(!eq(actual,expected)) mismatches.push({key,field,source,expected,actual,lastOp:row.ops.at(-1)});
            }
          }
          console.log('REQUEST_LEDGER_FILES',files.length);
          console.log('REQUEST_LEDGER_KEYS',ledger.size);
          console.log('REQUEST_LEDGER_MISMATCH_COUNT',mismatches.length);
          console.log('REQUEST_LEDGER_MISMATCHES',JSON.stringify(mismatches.slice(0,250)));
          NODE
      - name: Find historical state/snapshot files across all refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          {
            for c in $(git rev-list --all); do
              git ls-tree -r --name-only "$c"
            done
          } | sort -u | grep -Ei '(^|/)([^/]*(live[-_ ]?state|snapshot|backup|checkpoint|recovery)[^/]*\.json|catalogue[^/]*(state|backup|snapshot)[^/]*\.json)$' | head -n 300 || true
      - name: Inspect preserved live snapshot history
        shell: bash
        run: |
          set -euo pipefail
          echo 'SNAPSHOT_HISTORY_BEGIN'
          git log --all --date=iso-strict --format='%H %cI %s' -- live-snapshot-overrides.json || true
          echo 'SNAPSHOT_HISTORY_END'
          found=''
          for c in $(git log --all --format=%H -- live-snapshot-overrides.json); do
            if git cat-file -e "$c:live-snapshot-overrides.json" 2>/dev/null; then
              found="$c"
              break
            fi
          done
          if [[ -n "$found" ]]; then
            echo "SNAPSHOT_COMMIT=$found"
            git show "$found:live-snapshot-overrides.json" > historical-live-snapshot.json
            node - <<'NODE'
            const fs=require('fs');
            const s=JSON.parse(fs.readFileSync('historical-live-snapshot.json','utf8'));
            console.log('SNAPSHOT_COUNTS', JSON.stringify({entries:Object.keys(s.entries||{}).length,cards:Object.keys(s.cards||{}).length,sections:Object.keys(s.sections||{}).length,updatedAt:s.updatedAt||''}));
            console.log('SNAPSHOT_SECTION_KEYS', JSON.stringify(Object.keys(s.sections||{})));
            NODE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: current-live-catalogue-state
          path: live-state.json
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('historical-live-snapshot.json') != '' }}
        with:
          name: historical-live-snapshot
          path: historical-live-snapshot.json
          retention-days: 2
