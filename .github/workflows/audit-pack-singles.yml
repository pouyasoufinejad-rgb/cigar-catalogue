name: Audit pack singles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-pack-singles.mjs'
      - '.github/workflows/audit-pack-singles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read live multi-stick catalogue entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-pack-singles.mjs
