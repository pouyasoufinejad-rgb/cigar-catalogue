name: Fix variant size copy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: cigar-catalogue-production-publisher
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
        run: node scripts/fix-live-variant-size-copy.mjs
