name: Run live catalogue repair now

on:
  pull_request:
    paths:
      - '.github/workflows/run-live-repair-now.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CATALOGUE_ADMIN_TOKEN: ${{ secrets.CATALOGUE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Repair live KV
        run: node scripts/repair-pre-sidebar-live-state.mjs
      - name: Verify production fields and SmokingPipes links
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { loadPreSidebarRequestLedger, RECOVERED_RETAILER_LINKS } from './scripts/repair-pre-sidebar-live-state.mjs';
          const state=await fetch('https://cigar-catalogue.psncodex.workers.dev/api/catalogue-overrides?hotfix_verify='+Date.now(),{cache:'no-store'}).then(r=>r.json());
          const ledger=await loadPreSidebarRequestLedger(process.cwd());
          const bad=[];
          for(const [key,x] of ledger) for(const f of ['productionLines','practicalLines']){
            if(!(f in x)) continue;
            const actual=(state.entries?.[key]?.[f]?.length ? state.entries[key][f] : state.cards?.[key]?.[f]);
            if(JSON.stringify(actual)!==JSON.stringify(x[f])) bad.push({key,field:f,expected:x[f],actual});
          }
          const missing=[];
          for(const [key,urls] of Object.entries(RECOVERED_RETAILER_LINKS)){
            const links=[...(state.entries?.[key]?.retailerLinks||[]),...(state.cards?.[key]?.retailerLinks||[])];
            for(const url of urls) if(!links.includes(url)) missing.push({key,url});
          }
          console.log('FINAL_LIVE_VERIFY '+JSON.stringify({entries:Object.keys(state.entries||{}).length,cards:Object.keys(state.cards||{}).length,fieldMismatches:bad,missingSmokingPipes:missing,updatedAt:state.updatedAt}));
          if(bad.length||missing.length) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('pre-repair-live-state.json') != '' }}
        with:
          name: live-state-before-emergency-repair
          path: pre-repair-live-state.json
          retention-days: 30
